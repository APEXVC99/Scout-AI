<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="dot-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Magnifying glass circle -->
  <circle cx="85" cy="90" r="55" stroke="url(#logo-grad)" stroke-width="8" fill="none"/>
  <!-- Handle -->
  <line x1="125" y1="125" x2="170" y2="170" stroke="url(#logo-grad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Radar pulse arcs inside -->
  <path d="M85 60 Q110 60 115 80" stroke="url(#dot-grad)" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M85 48 Q120 48 128 80" stroke="url(#dot-grad)" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M85 36 Q128 36 138 80" stroke="url(#dot-grad)" stroke-width="1.5" fill="none" opacity="0.25"/>
  <!-- Center dot / AI node -->
  <circle cx="85" cy="90" r="8" fill="url(#dot-grad)"/>
  <!-- Outer ring -->
  <circle cx="85" cy="90" r="65" stroke="url(#logo-grad)" stroke-width="1.5" fill="none" opacity="0.2"/>
</svg>
